<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="color-scheme" content="dark">
    <style>html { color-scheme: dark; background: #000; } body { background: #000; }</style>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>부끄판</title>
    <meta name="description" content="검은 화면에 함께 그리는 흰 선. 오래도록 남는 우리만의 무한 그림판.">
    <link rel="canonical" href="https://bukupan.hooreique.com/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:site_name" content="부끄판">
    <meta property="og:title" content="부끄판">
    <meta property="og:description" content="검은 화면에 함께 그리는 흰 선. 오래도록 남는 우리만의 무한 그림판.">
    <meta property="og:url" content="https://bukupan.hooreique.com/">
    <meta property="og:image" content="https://bukupan.hooreique.com/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="검은 배경 왼쪽에 분홍 타원과 흰 손그림 아이콘, 오른쪽에 굵은 부끄판 글자. 부끄는 흐릿한 베이비 핑크색, 판은 흰색.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="부끄판">
    <meta name="twitter:description" content="검은 화면에 함께 그리는 흰 선. 오래도록 남는 우리만의 무한 그림판.">
    <meta name="twitter:image" content="https://bukupan.hooreique.com/og-image.png">
    <meta name="twitter:image:alt" content="검은 배경 왼쪽에 분홍 타원과 흰 손그림 아이콘, 오른쪽에 굵은 부끄판 글자. 부끄는 흐릿한 베이비 핑크색, 판은 흰색.">
    <link rel="icon" href="/icon.svg" type="image/svg+xml" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/style.css">
    <script src="/renderer.js" defer></script>
    <script src="/codec.js" defer></script>
    <script src="/world.js" defer></script>
    <script src="/outbox.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <canvas aria-label="함께 그리는 영구 그림판. 두 손가락으로 이동하고 확대할 수 있습니다."></canvas>
    <div id="eraser-cursor" hidden aria-hidden="true"></div>
    <div class="save-state">
      <span class="brand" aria-label="부끄판">부끄판</span>
      <span id="status" role="status" aria-live="polite">연결을 준비하고 있어요</span>
      <div id="recovery" hidden>
        <button id="retry" type="button">다시 시도</button>
        <button id="export" type="button">미전송 작업 내보내기</button>
        <button id="discard" type="button" hidden>미전송 작업 제외</button>
      </div>
    </div>
    <div id="controls">
      <div class="toolbar" role="toolbar" aria-label="그림 도구">
        <button type="button" data-tool="pen" aria-pressed="true" title="펜 (B)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 4 5 5M4 20l5-1L21 7l-4-4L5 15Z"/></svg><span>펜</span></button>
        <button type="button" data-tool="erase" aria-pressed="false" title="지우개 (E)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 8 8 8M4 13l9-9 8 8-8 8H9l-5-5Z"/></svg><span>지우개</span></button>
        <button type="button" data-tool="move" aria-pressed="false" title="이동 (H 또는 Space + 드래그)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18M8 7l4-4 4 4M8 17l4 4 4-4M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg><span>이동</span></button>
        <span class="divider" aria-hidden="true"></span>
        <button type="button" id="undo" disabled title="내 마지막 작업 취소 (Ctrl/⌘ Z)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5-5 5 5 5M3 10h11a6 6 0 0 1 0 12" transform="translate(0 -2)"/></svg><span>취소</span></button>
      </div>
      <div class="navigation" role="group" aria-label="화면 이동과 확대">
        <button type="button" id="zoom-out" aria-label="축소" title="축소 (-)">−</button>
        <output id="zoom-level" aria-label="확대 비율">100%</output>
        <button type="button" id="zoom-in" aria-label="확대" title="확대 (+)">+</button>
        <span class="divider" aria-hidden="true"></span>
        <button type="button" id="home" title="처음 위치와 100% 배율로 (0)">처음 위치</button>
      </div>
      <details class="help">
        <summary aria-label="사용법">?</summary>
        <p>그림은 함께 남고, 화면은 각자 움직여요.</p>
        <p>두 손가락으로 이동·확대<br>마우스 휠로 확대 · Space + 드래그로 이동</p>
        <p>펜 B · 지우개 E · 이동 H<br>내 작업 취소 Ctrl/⌘ Z · 처음 위치 0</p>
      </details>
    </div>
  </body>
</html>
