<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Renderer checks</title>
<body style="background:#111;color:white"><pre id="result">Running…</pre><canvas width="800" height="600"></canvas>
<script src="/renderer.js"></script>
<script>
try {
  const canvas = document.querySelector('canvas');
  const renderer = createStrokeRenderer(canvas, 40000);
  if (!renderer) throw Error('WebGL2 unavailable');
  const gl = canvas.getContext('webgl2');
  const camera = { x: 0, y: 0, zoom: 1 };
  const at = (x, y) => { const p = new Uint8Array(4); gl.readPixels(x, 599-y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p); return p[0]; };
  const check = (ok, message) => { if (!ok) throw Error(message); };
  const stroke = { width: 3, lines: [[-200,0,0,0], [0,0,200,0]] };
  renderer.render([stroke], camera, 800, 600);
  check(at(300,300) > 240 && at(400,300) === at(300,300), 'Join brightness');
  renderer.render([{width:3, lines:[[0,0,0,0]]}], camera, 800, 600);
  check(at(400,300) > 240 && at(410,300) === 0, 'Dot');
  renderer.render([{width:3, lines:[[1e8,1e8,1e8+100,1e8]]}], {x:1e8,y:1e8,zoom:2}, 800, 600);
  check(at(500,300)>240 && at(500,302)>240 && at(500,305)===0, 'Distant origin / scaled width');
  renderer.render([{width:3, lines:[[-200,0,-20,0],[20,0,200,0]]}], camera, 800, 600);
  check(at(300,300)>240 && at(400,300)===0 && at(500,300)>240, 'Partial erase geometry');
  renderer.render([{width:3, lines:Array.from({length:40000},()=>[-200,0,200,0])}], camera,800,600);
  check(at(400,300)>240 && gl.getError()===gl.NO_ERROR,'Capacity / GL errors');
  renderer.render([],camera,800,600);
  check(at(400,300)===0,'Clearing removed geometry');
  document.querySelector('#result').textContent='PASS renderer pixels, distant coordinates, zoom, erasure and capacity';
} catch(error) { document.querySelector('#result').textContent='FAIL '+error.stack; }
</script></body></html>
