<!doctype html><meta charset="utf-8"><title>Client test frame</title>
<canvas style="width:300px;height:300px"></canvas>
<script>
window.connections = [];
window.snapshots = 0;
const NativeSocket = WebSocket;
window.WebSocket = class extends NativeSocket {
  constructor(url) {
    super(url);
    connections.push(this);
    this.addEventListener('message', event => {
      if (event.data instanceof ArrayBuffer && new Uint8Array(event.data)[1] === 3) snapshots++;
    });
  }
};
window.createStrokeRenderer = () => ({
  invalidate() {},
  render(segments) { window.observed = segments; },
});
</script>
<script src="../client/codec.js"></script>
<script src="../client/app.js"></script>
